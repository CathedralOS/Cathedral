[package]
name = "cathedral-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cathedral-desktop"
path = "main.rs"
test = false
bench = false

[features]
storage-lab = []
trace-input = ["cathedral-colors?/trace-input"]
trace-storage = ["cathedral-colors?/trace-storage"]
desktop = ["dep:cathedral-colors"]
notes = ["desktop"]
shell = ["notes"]
notes-probes = ["notes"]
launcher-stop-probe = ["shell"]
launcher-revoke-probe = ["shell"]
launcher-read-revoke-probe = ["shell"]
launcher-read-stop-probe = ["shell"]
launch-read-revoke-probe = ["shell"]
launch-pending-loss-probe = ["shell"]
launch-read-stop-probe = ["shell"]
launch-target-stop-probe = ["launch-read-stop-probe"]
selection-stop-probe = ["launch-target-stop-probe"]
management-revoke-probe = ["shell"]
login-recovery-probe = ["shell"]
bootstrap-probes = ["shell"]
bootstrap-display = ["bootstrap-probes"]
bootstrap-input = ["bootstrap-probes"]
bootstrap-root = ["bootstrap-probes"]
bootstrap-stall = ["bootstrap-probes"]
bootstrap-malformed = ["bootstrap-probes"]
bootstrap-refusal = ["bootstrap-probes"]
bootstrap-repeat = ["bootstrap-probes"]
storage-startup-fault = ["shell"]
storage-startup-stall = ["shell"]
storage-startup-bad-ready = ["shell"]
storage-startup-repeat = ["shell"]
storage-live-probes = ["shell"]
storage-live-nested = ["storage-live-probes"]
storage-live-deep = ["storage-live-probes"]
storage-live-postcommit = ["storage-live-probes"]
storage-live-repeat = ["storage-live-probes"]
storage-live-readiness-stall = ["storage-live-probes"]
desktop-probes = ["desktop"]
database-probes = ["desktop"]

[dependencies]
cathedral-desktop-matrix-contracts.workspace = true
cathedral-colors = { workspace = true, optional = true }
cathedral-kernel-contracts.workspace = true
cathedral-platform-contracts.workspace = true
cathedral-user-runtime.workspace = true
cathedral-bitmap-font.workspace = true

[lints]
workspace = true
