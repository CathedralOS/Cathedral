[package]
autotests = false
name = "cathedral-stock-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "cathedral-stock-matrix"
path = "main.rs"
test = false
bench = false

[dependencies]
cathedral-matrix.workspace = true
cathedral-desktop-matrix-contracts.workspace = true
cathedral-kernel-contracts.workspace = true
cathedral-platform-contracts.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cathedral-user-runtime.workspace = true

[lints]
workspace = true

[features]
desktop-host = []
bootstrap-probes = []
trace-input = []
trace-storage = []
startup-fault = []
interaction-delay = []
recovery-delay = []
launch-delay = []
launch-bind-failure = []
launch-place-failure = []
input-producer-probe = []
