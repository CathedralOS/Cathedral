[package]
name = "cathedral-chooser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[[bin]]
name = "cathedral-chooser"
path = "main.rs"
test = false
bench = false

[features]
rust-probes = []
recovery-probes = ["rust-probes"]
launcher-startup-fault = ["rust-probes"]
picker-startup-fault = ["rust-probes"]
trace-storage = ["cathedral-omega-app/trace-storage"]

[dependencies]
cathedral-omega-app.workspace = true
cathedral-desktop-matrix-contracts.workspace = true
cathedral-platform-contracts.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cathedral-matrix.workspace = true
cathedral-kernel-contracts.workspace = true
cathedral-user-runtime.workspace = true
cathedral-bitmap-font.workspace = true

[lints]
workspace = true
