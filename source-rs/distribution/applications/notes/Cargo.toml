[package]
autotests = false
name = "cathedral-notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "cathedral-notes"
path = "main.rs"
test = false
bench = false

[features]
rust-probes = []
capture-source-exit = ["rust-probes"]
capture-source-stall = ["rust-probes"]
render-demand-probe = ["rust-probes"]
trace-input = []
trace-storage = ["cathedral-omega-app/trace-storage"]
render-probes = ["rust-probes"]
startup-fault = ["rust-probes"]
admitted-fault = ["rust-probes"]
management-probes = ["rust-probes"]
input-receiver-probe = ["rust-probes"]
input-producer-probe = ["rust-probes"]
input-producer-partial = ["input-producer-probe"]

[dependencies]
cathedral-omega-app.workspace = true
cathedral-desktop-matrix-contracts.workspace = true
cathedral-platform-contracts.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cathedral-matrix.workspace = true
cathedral-kernel-contracts.workspace = true
cathedral-user-runtime.workspace = true
cathedral-bitmap-font.workspace = true

[lints]
workspace = true
