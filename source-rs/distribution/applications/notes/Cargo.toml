[package]
name = "cathedral-notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "cathedral-notes"
path = "main.rs"
test = false
bench = false

[features]
trace-input = []
trace-storage = []
render-probes = []
startup-fault = []
admitted-fault = []
management-probes = []
input-producer-probe = []
input-producer-partial = ["input-producer-probe"]

[dependencies]
cathedral-desktop-matrix-contracts.workspace = true
cathedral-platform-contracts.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cathedral-matrix.workspace = true
cathedral-kernel-contracts.workspace = true
cathedral-user-runtime.workspace = true
cathedral-bitmap-font.workspace = true

[lints]
workspace = true
