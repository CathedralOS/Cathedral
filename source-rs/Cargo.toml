[workspace]
resolver = "3"
members = [
    # Kernel
    "kernel/contracts",
    "kernel/arch",
    "kernel/boot/uefi",
    "kernel/core",
    # Platform
    "platform/contracts",
    "platform/drivers/ata-pio",
    "platform/drivers/uart_16550",
    "platform/libraries/bitmap-font",
    "distribution/libraries/omega-ui",
    "platform/libraries/block-device",
    "platform/libraries/content-layout",
    "platform/libraries/database-objects",
    "platform/libraries/storage-volume",
    "platform/libraries/storage-volume/engine",
    "platform/libraries/user-runtime",
    "platform/libraries/omega-app",
    "platform/libraries/user-heap",
    "platform/services/display",
    "platform/services/input",
    "platform/services/storage",
    "platform/libraries/matrix",
    # Distribution
    "distribution/lab/matrix-composition",
    "distribution/lab/matrix-composition/matrix",
    "distribution/matrix",
    "distribution/matrix/contracts",
    "distribution/applications/chooser",
    "distribution/applications/colors",
    "distribution/applications/omega-ui",
    "distribution/applications/background",
    "distribution/applications/notes",
    "distribution/applications/split",
    "distribution/applications/input-demo",
    "distribution/applications/capture-demo",
    "distribution/lab/display",
    "distribution/lab/compositor",
    "distribution/desktop",
    "distribution/desktop/recovery",
    "distribution/lab/hello",
    "distribution/lab/portability",
    "distribution/lab/shared-memory",
    "distribution/lab/devices",
    "distribution/lab/volume",
    "distribution/lab/database",
    "distribution/lab/objects",
    "distribution/lab/database/worker",
    "distribution/lab/ipc",
    "distribution/lab/channels",
    "distribution/lab/memory",
    "distribution/lab/rendering",
    "distribution/lab/supervision",
    "distribution/libraries/boot-scene",
]
default-members = ["distribution/applications/colors", "distribution/applications/background", "distribution/matrix", "distribution/matrix/contracts", "distribution/applications/chooser", "distribution/applications/notes", "platform/libraries/user-heap", "platform/libraries/storage-volume", "platform/drivers/uart_16550", "distribution/lab/rendering", "kernel/contracts", "platform/contracts", "platform/libraries/block-device", "kernel/core", "kernel/arch", "platform/services/input", "platform/services/display", "platform/libraries/matrix", "platform/libraries/bitmap-font"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
cathedral-omega-app = { path = "platform/libraries/omega-app" }
cathedral-omega-ui = { path = "distribution/libraries/omega-ui" }
cathedral-matrix = { path = "platform/libraries/matrix" }
cathedral-desktop-matrix-contracts = { path = "distribution/matrix/contracts" }
cathedral-colors = { path = "distribution/applications/colors" }
cathedral-content-layout = { path = "platform/libraries/content-layout" }
cathedral-database-objects = { path = "platform/libraries/database-objects" }
cathedral-storage-engine = { path = "platform/libraries/storage-volume/engine" }
cathedral-user-heap = { path = "platform/libraries/user-heap" }
cathedral-storage-volume = { path = "platform/libraries/storage-volume" }
cathedral-ata-pio = { path = "platform/drivers/ata-pio" }
cathedral-storage-service = { path = "platform/services/storage" }
cathedral-bitmap-font = { path = "platform/libraries/bitmap-font" }
cathedral-kernel-contracts = { path = "kernel/contracts" }
cathedral-platform-contracts = { path = "platform/contracts" }
cathedral-block-device = { path = "platform/libraries/block-device" }
cathedral-core = { path = "kernel/core" }
cathedral-uart-16550 = { path = "platform/drivers/uart_16550" }
cathedral-arch = { path = "kernel/arch" }
cathedral-user-runtime = { path = "platform/libraries/user-runtime" }
cathedral-boot-scene = { path = "distribution/libraries/boot-scene" }
uefi = { version = "0.41.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

# BLAKE3's unrolled debug code exceeds the bounded guest ELF window. Keep the
# caller debug build and checks; optimize only this dependency's implementation.
[profile.dev.package.blake3]
opt-level = "s"

# Database fixtures monomorphize a large engine. Size-optimize their packages;
# one redb codegen unit keeps the provider within the 240-page image budget.
# Selected engine/fixture packages disable debug_assert! below; explicit assert!
# checks remain enabled. Strip executable DWARF for the ELF file cap.
[profile.dev.package.redb]
opt-level = "z"
codegen-units = 1
debug-assertions = false

[profile.dev.package.cathedral-database-worker]
opt-level = "s"
debug-assertions = false
strip = "debuginfo"

[profile.release]
panic = "abort"
debug = 2

[profile.release.package.redb]
opt-level = "s"
# Size-optimize the stock policy/IPC executable independently of the rasterizer.
# Program objects now permit 1 MiB; keep ordinary optimization rather than
# tightening it to work around the former 256 KiB storage bound.
[profile.release.package.cathedral-stock-matrix]
opt-level = "s"

[profile.release.package.cathedral-database-worker]
opt-level = "s"
strip = "debuginfo"

[profile.dev.package.cathedral-stock-matrix]
opt-level = "s"
[profile.dev.package.cathedral-storage-service]
opt-level = "s"
codegen-units = 1
debug-assertions = false
strip = "debuginfo"

[profile.release.package.cathedral-storage-service]
opt-level = "s"
strip = "debuginfo"

[profile.dev.package.cathedral-database-objects]
opt-level = "z"
codegen-units = 1
debug-assertions = false

[profile.dev.package.cathedral-storage-engine]
opt-level = "s"

[profile.dev.package.cathedral-content-layout]
opt-level = "s"

[profile.release.package.cathedral-database-objects]
opt-level = "s"
codegen-units = 1

[profile.dev.package.cathedral-ata-pio]
opt-level = "s"

# Keep the database provider inside the existing user-image admission bound.
# Runtime assertions remain enabled; optimize code size without raising limits.
[profile.dev.package.cathedral-user-runtime]
opt-level = "s"
codegen-units = 1

# These are linked into the same bounded provider; keep their checks while
# avoiding unoptimized wire decoding and allocator machinery in the dev ELF.
[profile.dev.package.cathedral-platform-contracts]
opt-level = "s"

[profile.dev.package.cathedral-kernel-contracts]
opt-level = "s"

[profile.dev.package.cathedral-user-heap]
opt-level = "s"

[profile.dev.package.linked_list_allocator]
opt-level = "s"


# Keep shared transport/teardown code compact in independently linked services.
[profile.release.package.cathedral-user-runtime]
opt-level = "s"
