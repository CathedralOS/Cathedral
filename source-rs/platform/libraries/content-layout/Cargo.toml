[package]
name = "cathedral-content-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
path = "lib.rs"
[dependencies]
blake3 = { version = "1.8.7", default-features = false }
[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
# Rust SIMD avoids assembling ELF objects with a Windows host C toolchain.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
[lints]
workspace = true
