[package]
name = "cathedral-boot-uefi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build/main.rs"

[[bin]]
name = "cathedral-boot-uefi"
path = "main.rs"
test = false
bench = false

[features]
bundled-user = []
smoke-test = ["cathedral-core/memory-lab"]
fault-text-write = ["smoke-test"]
fault-rodata-write = ["smoke-test"]
fault-heap-execute = ["smoke-test"]
fault-stack-execute = ["smoke-test"]
fault-heap-alias-execute = ["smoke-test"]
fault-stack-alias-execute = ["smoke-test"]
fault-guard = ["smoke-test"]
fault-invalid-opcode = ["smoke-test"]
fault-double-fault = ["smoke-test"]

[dependencies]
cathedral-contracts.workspace = true
cathedral-core.workspace = true
cathedral-uart-16550.workspace = true
cathedral-arch.workspace = true
uefi.workspace = true

[lints]
workspace = true

[build-dependencies]
cathedral-contracts.workspace = true
