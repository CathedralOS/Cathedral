[package]
name = "cathedral-redb-portability-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
redb = { version = "=4.4.0", default-features = false, features = ["experimental-api-5"] }

[workspace]

[[bin]]
name = "measure-runtime"
path = "measure/main.rs"
required-features = ["measure"]

[features]
measure = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
